<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probability Oracle: protocol risk demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/demo.css">
</head>
<!-- The protocol demo (unit 7.9), laid out as docs/design/Protocol.dc.html. REPLAY of real
     Gemini hourly prices for the ETH market, in about a minute. The lending pool is a DEMO pool
     (no real deposits) whose risk level and loan limit are real onchain state. The Aave V4 panel
     is the LIVE ADVISOR: read only, from today's odds, not part of the replay. -->
<body class="screen">
<header class="bar" id="bar"></header>

<main class="page">
  <section class="demo-head">
    <h1>Protocol risk demo</h1>
    <div class="controls">
      <div class="progress">
        <div class="track" id="progress" role="progressbar" aria-label="Replay progress" aria-valuemin="0"><i id="progress-fill"></i></div>
        <div class="labels"><span id="progress-from"></span><b id="progress-clock"></b><span id="progress-to"></span></div>
      </div>
      <button class="primary" id="start" type="button">Start replay</button>
    </div>
  </section>

  <div class="banner" id="banner" role="alert"></div>

  <div class="row-main">
    <section class="panel chart" aria-labelledby="chart-title">
      <h2 id="chart-title">Chance</h2>
      <svg class="plot" id="plot" role="img"></svg>
    </section>

    <section class="panel side" aria-labelledby="limit-title">
      <div class="between"><h2 id="limit-title">What the loan limit is</h2><span class="chip">Demo pool</span></div>
      <p class="note" id="limit-text"></p>
      <div class="tiers"><table id="tiers"></table></div>
    </section>
  </div>

  <div class="row-low">
    <section class="panel" aria-labelledby="flow-title" style="flex: 2.7 1 0">
      <h2 id="flow-title">What happens at each post</h2>
      <div class="flowrow" id="flow"></div>
    </section>

    <section class="panel dashed" aria-labelledby="aave-title" style="flex: 1.35 1 0">
      <div class="between"><h2 id="aave-title">Aave V4 advisor</h2><span class="chip blue">Live, read only</span></div>
      <p class="note" id="aave-text">Reading Aave V4 on Arc mainnet.</p>
      <div class="fromto" id="aave-row" hidden></div>
    </section>

    <section class="panel" aria-labelledby="events-title" style="flex: 1 1 0">
      <h2 id="events-title">Events</h2>
      <div class="scroll"><ol class="events" id="events"></ol></div>
    </section>
  </div>
</main>

<script src="/static/demo.js"></script>
<script>
  const limitOf = (t) => (t.paused ? "Paused" : pct(t.maxLtvBps));
  const toneOf = (level, tiers) => (!level ? "" : tiers[level].paused ? "red" : "orange");

  // The stacked chart: on top the chance with the pool's tier lines, below it the loan limit
  // as steps. A dotted guide runs through both at every real change of the pool's level.
  // Each real change of the pool's level, with the post that set it off.
  function movesOf(view) {
    const run = view.run, moves = [];
    (run ? run.published : []).forEach((p, i) => { const c = setOffBy(run, i, view.changes); if (c) moves.push({ ...c, index: i, post: p }); });
    return moves;
  }
  function drawPlot(view, head) {
    const svg = $("plot"), w = svg.clientWidth, h = svg.clientHeight;
    if (!w || !h) return;
    const run = view.run, done = run && run.status === "done", tiers = view.pool.tiers;
    // The posts the playhead has reached; the newest one's value is still moving to its number.
    const points = head ? run.published.slice(0, head.shown).map((p, i) => (i === head.shown - 1 ? { ...p, harmBps: head.bps } : p)) : [];
    const L = 52, R = w - 20, T1 = 30, B2 = h - 40, B1 = T1 + (B2 - T1) * 0.56, T2 = B1 + 42;
    const { X, days } = replayScale(view, L, R);
    const Y = (bps) => B1 - (bps / 10000) * (B1 - T1);
    const top = tiers[0].maxLtvBps, YL = (bps) => B2 - (bps / (top * 1.25)) * (B2 - T2);
    const drop = `Chance of ${/^[AEIOU]/.test(view.asset) ? "an" : "a"} ${view.asset} drop`;

    let out = `<text x="${L}" y="${T1 - 12}" font-size="13" font-weight="500" fill="#3E464D">${drop}</text>` +
      `<line x1="${L}" y1="${T1}" x2="${R}" y2="${T1}" stroke="#DDE1E4"/><line x1="${L}" y1="${B1}" x2="${R}" y2="${B1}" stroke="#AEB6BD"/>` +
      `<text x="${L - 8}" y="${T1 + 4}" font-size="12" fill="#59626A" text-anchor="end">100%</text><text x="${L - 8}" y="${B1 + 4}" font-size="12" fill="#59626A" text-anchor="end">0%</text>` +
      `<text x="${L}" y="${T2 - 12}" font-size="13" font-weight="500" fill="#3E464D">Loan limit</text>` +
      `<line x1="${L}" y1="${B2}" x2="${R}" y2="${B2}" stroke="#AEB6BD"/>` +
      `<text x="${L - 8}" y="${YL(top) + 4}" font-size="12" fill="#59626A" text-anchor="end">${pct(top)}</text><text x="${L - 8}" y="${B2 + 4}" font-size="12" fill="#59626A" text-anchor="end">0%</text>` +
      `<line x1="${L}" y1="${YL(top)}" x2="${R}" y2="${YL(top)}" stroke="#DDE1E4"/>`;
    for (const d of days) out += `<text x="${d.x}" y="${h - 12}" font-size="12" fill="#59626A" text-anchor="middle">${d.label}</text>`;
    out += `<text x="${R}" y="${h - 12}" font-size="12" fill="#59626A" text-anchor="end">End</text>`;
    // The pool's own tiers, from the risk switch.
    tiers.slice(1).forEach((t, i) => {
      const y = Y(t.thresholdBps), red = t.paused;
      out += `<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="${red ? "#B8322A" : "#D8632C"}" stroke-width="${i ? 1.5 : 1}" stroke-dasharray="5 5"/>` +
        `<text x="${L + 8}" y="${y - 5}" font-size="12" font-weight="500" fill="${red ? "#9A2A23" : "#A9461A"}">${pct(t.thresholdBps)}: ${red ? "new loans paused" : "limit " + pct(t.maxLtvBps)}</text>`;
    });
    // The real hourly history that the replay plays back, in grey until the oracle posts it.
    out += `<path d="${stepped(view.path, X, Y, R)}" fill="none" stroke="#C9CED3" stroke-width="1.5" stroke-linejoin="round"/>`;

    if (points.length) {
      const last = points.at(-1), headX = Math.min(R, X(head.t)), line = stepped(points, X, Y, headX), atEnd = done && headX >= R - 0.5;
      const moves = movesOf(view).filter((m) => m.index < points.length).map((m) => ({ ...m, x: X(m.post.time) }));
      const paused = moves.some((m) => m.paused), endTone = paused ? "#B8322A" : "#2756C5";
      for (const m of moves) out += `<line x1="${m.x}" y1="${T1}" x2="${m.x}" y2="${B2}" stroke="#7D868E" stroke-width="1" stroke-dasharray="2 4"/>`;
      out += `<path d="${line} V ${B1} H ${X(points[0].time).toFixed(1)} Z" fill="#2756C5" fill-opacity="0.08"/>` +
        `<path d="${line}" fill="none" stroke="#2756C5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (!atEnd) out += `<line x1="${headX}" y1="${T1}" x2="${headX}" y2="${B2}" stroke="#7D868E" stroke-width="1"/>`; // the playhead
      out += (paused ? `<circle cx="${headX}" cy="${Y(last.harmBps)}" r="10" fill="#B8322A" fill-opacity="0.18"/>` : "") + `<circle cx="${headX}" cy="${Y(last.harmBps)}" r="4.5" fill="${endTone}"/>` +
        `<text x="${headX - 10}" y="${Y(last.harmBps) + (last.harmBps > 8000 ? 20 : -12)}" font-size="13" font-weight="600" fill="${paused ? "#9A2A23" : "#1E46A3"}" text-anchor="end" paint-order="stroke" stroke="#F4F5F6" stroke-width="4">${Math.round(last.harmBps / 100)}% ${atEnd ? "at the end" : "now"}</text>`;

      // The loan limit: the first tier until the pool's level changes, then each new limit.
      let d = `M ${X(points[0].time).toFixed(1)} ${YL(top).toFixed(1)}`, labels = `<text x="${X(points[0].time) + 6}" y="${YL(top) - 7}" font-size="13" font-weight="600" fill="#1C2126">${pct(top)}</text>`, pauseAt = null, limitY = YL(top);
      for (const m of moves) {
        if (m.paused) { pauseAt = m; break; }
        limitY = YL(m.maxLtvBps);
        d += ` H ${m.x.toFixed(1)} V ${limitY.toFixed(1)}`;
        labels += `<text x="${m.x + 6}" y="${YL(m.maxLtvBps) - 7}" font-size="13" font-weight="600" fill="#1C2126">${pct(m.maxLtvBps)}</text>`;
      }
      d += ` H ${(pauseAt ? pauseAt.x : headX).toFixed(1)}`;
      out += `<path d="${d}" fill="none" stroke="#1C2126" stroke-width="2" stroke-linejoin="round"/>` + labels;
      if (pauseAt) {
        out += `<line x1="${pauseAt.x}" y1="${limitY}" x2="${pauseAt.x}" y2="${B2}" stroke="#B8322A" stroke-width="2"/>` +
          (headX > pauseAt.x ? `<line x1="${pauseAt.x}" y1="${B2}" x2="${headX}" y2="${B2}" stroke="#B8322A" stroke-width="3"/>` : "") +
          `<circle cx="${pauseAt.x}" cy="${B2}" r="5" fill="#B8322A"/>` +
          `<text x="${pauseAt.x - 10}" y="${B2 - 9}" font-size="13" font-weight="600" fill="#9A2A23" text-anchor="end">Paused</text>`;
      }
      svg.setAttribute("aria-label", `During the replay the chance ${view.risk} went from ${pct(points[0].harmBps)} to ${pct(run.published.at(-1).harmBps)}. The pool's loan limit: ${[pct(top), ...moves.map((m) => (m.paused ? "new loans paused" : pct(m.maxLtvBps)))].join(", then ")}.`);
    } else {
      svg.setAttribute("aria-label", `The chance ${view.risk} and the pool's loan limit. The replay has not started.`);
    }
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.innerHTML = out;
  }

  // The live advisor: read once when the page opens. It is not part of the replay.
  let advisor = null, advisorFailed = false;
  function drawAdvisor(view) {
    if (advisorFailed) $("aave-text").textContent = "Aave V4 on Arc mainnet: not read. Reload the page to try again. This panel is live and read only, not part of this replay.";
    if (!advisor || !view) return;
    const token = advisor.market.split(", ").pop().replace(" reserve", ""), tiers = view.pool.tiers, level = advisor.level;
    const event = advisor.reason.match(/^The chance that (.+?) is [\d.]+%/)?.[1] ?? "its market's bad outcome happens";
    const tier = level ? `the ${pct(tiers[level].thresholdBps)} tier` : `under the ${pct(tiers[1].thresholdBps)} tier`;
    $("aave-text").textContent = `The same tiers, applied to a real market: Aave V4 on Arc mainnet. It suggests a change; Aave’s governance decides. It is live, not part of this replay: it uses today’s chance that ${event} (${pct(advisor.harm.harmBps)}, ${tier}). Nothing is sent to Aave.`;
    const now = advisor.current, next = advisor.recommended, tone = toneOf(level, tiers), row = $("aave-row"), to = el("span");
    if (next.frozen && !now.frozen) to.append(el("i", "", "open to "), el("strong", tone, "frozen"));
    else if (next.collateralFactorBps !== now.collateralFactorBps) to.append(el("i", "", pct(now.collateralFactorBps) + " to "), el("strong", tone, pct(next.collateralFactorBps)));
    else to.append(el("strong", "", pct(now.collateralFactorBps)), el("i", "", ", no change"));
    row.replaceChildren(el("b", "", next.frozen && !now.frozen ? `New borrowing against ${token}` : `${token} collateral factor`), to);
    row.hidden = false;
  }
  let lastView = null;
  fetch("/api/advisor").then((r) => r.json()).then((a) => { if (a.error) throw new Error(a.error); advisor = a; drawAdvisor(lastView); }).catch(() => { advisorFailed = true; drawAdvisor(lastView); });

  bootDemo("protocol", (view) => {
    lastView = view;
    const run = view.run, points = run ? run.published : [], done = run && run.status === "done", tiers = view.pool.tiers, last = points.at(-1);
    const a = /^[AEIOU]/.test(view.asset) ? "an" : "a";
    const moves = movesOf(view);
    // The pool's level in this run: from its newest sync. Before the first one, the first tier.
    const level = run && view.syncs.length ? view.pool.level : 0, now = tiers[level];

    $("chart-title").textContent = `Chance ${view.risk}, and what the pool did`;

    // --- The banner follows the pool.
    const before = moves.filter((m) => !m.paused).map((m) => pct(m.maxLtvBps));
    if (!run) banner({ tone: "", icon: "idle", title: `Ready to replay ${$("progress-from").textContent} to ${$("progress-to").textContent}`, more: "Real Gemini prices, played back in about a minute. Press Start replay." });
    else if (!last) banner({ tone: "", icon: "idle", title: "Starting", more: "The oracle is posting the first price on Arc." });
    else if (now.paused) banner({ tone: "red", icon: "critical", title: `New loans paused: the chance of ${a} ${view.asset} drop hit ${pct(moves.at(-1)?.post.harmBps ?? last.harmBps)}`, more: (before.length ? `First the pool lowered its loan limit from ${pct(tiers[0].maxLtvBps)} to ${before.join(", then ")}. ` : "") + "It reopens on its own when the chance falls.", href: moves.at(-1)?.txUrl });
    else if (level) banner({ tone: "orange", icon: "warning", title: `Loan limit lowered to ${pct(now.maxLtvBps)}: the chance of ${a} ${view.asset} drop passed ${pct(now.thresholdBps)}`, more: `It was ${pct(tiers[level - 1].maxLtvBps)}. The next step is ${tiers[level + 1].paused ? "a pause" : pct(tiers[level + 1].maxLtvBps)}, at ${pct(tiers[level + 1].thresholdBps)}.`, href: moves.at(-1)?.txUrl });
    else banner({ tone: "", icon: "idle", title: `Normal: the loan limit is ${pct(now.maxLtvBps)}`, more: `The chance of ${a} ${view.asset} drop is ${pct(last.harmBps)}. The pool lowers its limit at ${pct(tiers[1].thresholdBps)}.` });

    // --- What the loan limit is: one paragraph, and the pool's tiers as the risk switch holds them.
    const first = tiers[0], dollars = (t) => "$" + Math.round(t.maxLtvBps / 100);
    $("limit-text").textContent = `The loan limit is the most you can borrow against what you deposit: at ${pct(first.maxLtvBps)}, $100 of ${view.asset} lets you borrow up to ${dollars(first)}. ` +
      `If ${view.asset} falls, a loan can end up worth more than its collateral, so as the chance of a drop rises this demo pool lowers the limit, and pausing new loans is the last step. ` +
      `Each pool picks its own tiers once, when it joins the risk switch. In this demo pool, which holds no real deposits, only new loans are checked.`;
    $("tiers").innerHTML = `<thead><tr><th scope="col">Chance of a drop</th><th scope="col">Loan limit</th><th scope="col">With $100 of ${view.asset}</th></tr></thead><tbody>` +
      tiers.map((t, i) => `<tr class="${run && last && i === level ? "now " + toneOf(i, tiers) : ""}"><th scope="row">${i ? pct(t.thresholdBps) + " or more" : "Under " + pct(tiers[1].thresholdBps)}</th><td>${limitOf(t)}</td><td>${t.paused ? "no new loans" : "borrow " + dollars(t)}</td></tr>`).join("") + `</tbody>`;

    // --- The flow: one post, and what it set off. While the replay runs it shows the newest
    // post; afterwards, the post behind the last change.
    const shown = points.length ? (done && moves.length ? moves.at(-1).index : points.length - 1) : -1;
    const viaStream = run ? run.via === "stream" : null;
    if (shown < 0) {
      $("flow-title").textContent = "What happens at each post";
      flow($("flow"), "idle", [
        { who: "Oracle, on Arc", what: "Posts the chance", detail: view.risk.replace(/ on .*$/, "").replace(" ends", ""), lit: true },
        { who: "QuickNode Stream", what: "Spots the post", detail: "Delivers it to the keeper", lit: true },
        { who: "Risk switch, on Arc", what: "Picks the tier", detail: "From the pool’s own tiers", lit: true },
        { who: "Lending pool", what: "Applies it", detail: "A new loan limit, or a pause", lit: true },
      ]);
    } else {
      const p = points[shown], sync = setOffBy(run, shown, view.syncs), got = run.deliveries.find((d) => d.round === p.round);
      const changed = sync && sync.level !== sync.levelBefore, tier = sync ? tiers[sync.level] : null, tone = sync && changed && sync.level > sync.levelBefore ? toneOf(sync.level, tiers) : "";
      $("flow-title").textContent = "What happened at " + clockAt(run, sync ? sync.at : p.at);
      flow($("flow"), p.round, [
        { who: "Oracle, on Arc", what: "Posts the chance", detail: `${view.risk.replace(/ on .*$/, "").replace(" ends", "")}: ${pct(p.harmBps)}`, lit: true },
        viaStream
          ? { who: "QuickNode Stream", what: "Spots the post", detail: got ? `Delivered in ${(got.delayMs / 1000).toFixed(1)} s` : "Waiting for the delivery", lit: !!got }
          : { who: "Server, Stream off", what: "Passes the post on", detail: "Direct trigger, no Stream", lit: !!got || !!sync },
        { who: "Risk switch, on Arc", what: "Picks the tier", detail: tier ? `${sync.level ? pct(tier.thresholdBps) + " or more" : "Under " + pct(tiers[1].thresholdBps)}: ${tier.paused ? "pause" : "limit " + pct(tier.maxLtvBps)}` : "Reading the chance", lit: !!sync },
        { who: "Lending pool", what: changed ? "Applies it" : "No change", detail: !tier ? "Waiting for the tier" : tier.paused ? "New loans blocked" : changed ? `Loan limit now ${pct(tier.maxLtvBps)}` : `Loan limit stays ${pct(tier.maxLtvBps)}`, lit: !!sync, tone },
      ]);
    }

    // --- Events, on the replay clock.
    if (run) {
      const rows = [{ at: run.startedAt, kind: "info", title: "Replay started", more: viaStream ? "Posts reach the pool through the QuickNode Stream" : "Stream off: the server syncs the pool after each post" }];
      if (points[0]) rows.push({ at: points[0].at, kind: "data", title: `First post: ${pct(points[0].harmBps)}`, more: `Loan limit ${pct(first.maxLtvBps)}` });
      for (const m of moves) rows.push(m.paused
        ? { at: m.at, kind: "critical", title: "New loans paused", more: `at ${pct(m.post.harmBps)}`, tone: "red" }
        : { at: m.at, kind: "warning", title: `Loan limit to ${pct(m.maxLtvBps)}`, more: `passed ${pct(tiers[m.level].thresholdBps)}` });
      if (done) rows.push({ at: run.endedAt, kind: "info", title: `Replay ended at ${pct(last.harmBps)}`, more: now.paused ? "New loans stay paused" : `Loan limit ${pct(now.maxLtvBps)}` });
      events($("events"), run, rows);
    } else {
      $("events").replaceChildren(el("li", "empty", "Nothing yet. Each change of the loan limit appears here as the replay runs."));
    }
    drawAdvisor(view);
  }, drawPlot);
</script>
</body>
</html>
