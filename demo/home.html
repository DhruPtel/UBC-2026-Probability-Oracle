<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probability Oracle: overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/demo.css">
</head>
<!-- The home page (unit 7.7), laid out as docs/design/Main.dc.html. Every number is live:
     Gemini's prices (1), what our oracle posted on Arc (2), and what three users do with the
     BTC number (3). Headings stand alone; each card explains itself in one paragraph.
     The agent's holding is a DECLARED HOLDING and its contracts are PAPER TRADEs; the lending
     pool is a DEMO (no real deposits); the Aave card is a LIVE ADVISOR (read-only). The page
     says so in words: "declared holding", "paper trade", "demo pool", "Read only". -->
<body class="screen">
<header class="bar" id="bar"></header>

<main class="page">
  <h1>Overview</h1>

  <div class="top-row">
    <section class="panel prices" aria-labelledby="col1-title">
      <div class="between"><div class="titled"><span class="badge" aria-hidden="true">1</span><h2 id="col1-title">Market prices on Gemini</h2></div><span class="fine">Data provided by Gemini</span></div>
      <div class="list" id="prices"></div>
    </section>

    <div class="conn" id="conn" aria-hidden="true"></div>

    <section class="panel outputs" aria-labelledby="col2-title">
      <div class="titled"><span class="badge" aria-hidden="true">2</span><h2 id="col2-title">Oracle output, posted on Arc</h2></div>
      <div class="outs" id="outs"></div>
    </section>
  </div>

  <section class="users" aria-labelledby="users-title">
    <div class="titled"><span class="badge" aria-hidden="true">3</span><h2 id="users-title">What each user does with the number</h2></div>

    <div class="three">
      <article class="panel">
        <div class="between"><h3>Insurance agent</h3><span class="tags"><span class="chip">Yes or no</span></span></div>
        <svg class="rulebar" id="agent-rule"></svg>
        <div class="pair">
          <div class="at" id="agent-at"></div>
          <div class="bars" id="agent-bars"></div>
        </div>
        <p class="overview" id="agent-text"></p>
        <a class="go" href="/demo/agent">Watch it buy cover</a>
      </article>

      <article class="panel">
        <div class="between"><h3>Lending pool</h3><span class="tags"><span class="chip">Steps</span></span></div>
        <svg class="rulebar" id="pool-rule"></svg>
        <div class="pair">
          <div class="at" id="pool-at"></div>
          <div class="bars" id="pool-bars"></div>
        </div>
        <p class="overview" id="pool-text"></p>
        <a class="go" href="/demo/protocol">Watch it adjust</a>
      </article>

      <article class="panel dashed">
        <div class="between"><h3>Aave V4 advisor</h3><span class="tags"><span class="chip">Suggestion</span><span class="chip">Read only</span></span></div>
        <svg class="rulebar" id="aave-rule"></svg>
        <div class="pair wide">
          <div class="at" id="aave-at"></div>
          <table class="compare" id="aave-table"></table>
          <div class="bars" id="aave-bars"></div>
        </div>
        <p class="overview" id="aave-text"></p>
        <button class="go" id="proposal-open" disabled>View the written proposal</button>
      </article>
    </div>
  </section>
</main>

<dialog class="proposal" id="proposal" aria-labelledby="proposal-title">
  <h3 id="proposal-title">Written proposal for Aave V4</h3>
  <pre id="proposal-text"></pre>
  <button class="go" id="proposal-close">Close</button>
</dialog>

<script src="/static/demo.js"></script>
<script>
  const get = async (url) => {
    const data = await (await fetch(url)).json();
    if (data.error) throw new Error(data.error);
    return data;
  };
  const live = new EventSource("/events"); // it reconnects by itself
  const bar = topBar("/", live);
  $("conn").innerHTML = ARROW;

  // What the routes returned. Each part of the page draws as soon as what it needs is here.
  let oracle = null, agent = null, defi = null, advisor = null;
  const history = {}; // symbol → [{ time, chanceBps }]

  const price = (text) => (text === null ? "–" : "$" + Number(text).toFixed(3).replace(/0$/, ""));
  const dollars = (n) => "$" + n.toFixed(2);
  const day = (iso) => new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const outcome = (label) => label.split(": ").pop(); // "$67,500 or above", from the Gemini contract name
  const chanceOf = (m) => (m.harmfulOutcome === "YES" ? m.onchain.probBps : 10000 - m.onchain.probBps);
  const at = (box, tone, when, main, more) => {
    box.className = "at " + tone;
    box.replaceChildren(el("small", "", when), el("b", "", main), el("span", "", more));
  };

  // The pool's tier a chance falls in, and the colour that goes with it: grey below the first
  // threshold, red where the pool pauses, orange between.
  const levelAt = (bps) => (defi ? defi.tiers.reduce((level, t, i) => (t.thresholdBps <= bps ? i : level), 0) : 0);
  const toneOf = (level) => (!defi || level === 0 ? "" : defi.tiers[level].paused ? "red" : "orange");
  // The BTC number: what the oracle last posted for the market the pool follows.
  const btcMarket = () => oracle && defi && oracle.markets.find((m) => m.symbol === defi.symbol);
  const nowBps = () => (btcMarket() ? chanceOf(btcMarket()) : defi ? defi.feed.harmBps : null);

  // --- (1) Market prices.
  function drawPrices() {
    $("prices").replaceChildren(...oracle.markets.map((m) => {
      const g = m.gemini, card = el("div", "card soft price"), quote = el("div", "quote");
      const cell = (name, value) => { const c = el("span", "", name); c.append(el("span", "", value)); return c; };
      quote.append(cell("Best bid", price(g.bid)), cell("Best ask", price(g.ask)), cell("Middle", g.bid && g.ask ? price((Number(g.bid) + Number(g.ask)) / 2) : "–"),
        el("span", "yes", g.prob === null ? "–" : pct(Math.round(g.prob * 10000)) + " yes"));
      card.append(el("b", "", m.label), quote);
      return card;
    }));
  }

  // --- (2) Oracle output: one card per market.
  // The dashed lines on a market's chart: only the thresholds a rule uses on that market.
  function linesFor(symbol) {
    const threat = agent && agent.threats.find((t) => t.symbol === symbol);
    const pool = defi && defi.symbol === symbol ? defi.tiers.slice(1).map((t) => t.thresholdBps) : [];
    if (pool.length) return [...new Set([...(threat ? [Math.round(threat.trigger * 10000)] : []), ...pool])].sort((a, b) => a - b).map((bps) => ({ bps }));
    return threat ? [{ bps: Math.round(threat.trigger * 10000), label: "Agent buys cover above this line" }] : [];
  }
  function drawOutputs() {
    const charts = [];
    $("outs").replaceChildren(...oracle.markets.map((m) => {
      const chance = chanceOf(m), tone = toneOf(levelAt(chance)), yes = pct(m.onchain.probBps);
      const card = el("div", "card out " + tone), words = el("div", "words");
      const posted = el("span", "fine posted");
      posted.append(el("span", "posted-ago", "Posted " + ago(m.onchain.publishedAt)));
      posted.lastChild.dataset.at = m.onchain.publishedAt;
      if (m.onchain.txUrl) {
        const link = el("a", "", "View transaction");
        link.href = m.onchain.txUrl;
        link.target = "_blank";
        posted.append(el("br"), link);
      }
      words.append(
        el("span", "name", "Chance " + m.risk),
        el("span", "value", pct(chance)),
        el("span", "fine", m.harmfulOutcome === "NO" ? `Gemini says ${yes} for ${outcome(m.label)}, so 100% − ${yes}.` : `${outcome(m.label)} is the bad outcome, so it is the YES price as it is.`),
        posted);
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "spark");
      card.append(words, svg);
      charts.push(() => spark(svg, history[m.symbol], tone, m.risk, linesFor(m.symbol)));
      return card;
    }));
    for (const chart of charts) chart(); // drawn in pixels, so only once the cards are on the page
  }

  // The chance over the last 7 days, from Gemini's hourly closes. One line, 0 to 100, drawn at
  // the size the chart has on the page. lines: [{ bps, label? }] dashed thresholds.
  const SPARK = { "": "#59626A", orange: "#D8632C", red: "#B8322A" };
  function spark(svg, points, tone, risk, lines) {
    const w = svg.clientWidth, h = svg.clientHeight;
    if (!w || !h) return;
    const color = SPARK[tone], t1 = Date.now(), t0 = t1 - 7 * 24 * 3600 * 1000;
    const L = 26, R = w - 8, T = 8, B = h - 22;
    const X = (ms) => L + ((ms - t0) / (t1 - t0)) * (R - L), Y = (bps) => B - (bps / 10000) * (B - T);
    const tick = (bps) => `<text x="${L - 6}" y="${Y(bps) + 3.5}" font-size="10" fill="#59626A" text-anchor="end">${bps / 100}</text>`;
    let out = `<line x1="${L}" y1="${T}" x2="${R}" y2="${T}" stroke="#DDE1E4"/><line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#AEB6BD"/>` + tick(0) + tick(10000) +
      `<text x="${L}" y="${h - 4}" font-size="10" fill="#59626A">7 days ago</text><text x="${R}" y="${h - 4}" font-size="10" fill="#59626A" text-anchor="end">Now</text>`;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.setAttribute("role", "img");
    if (points && points.length) {
      const last = points.at(-1);
      // The newest close holds until now, so the line reaches the right edge.
      const line = points.map((p) => `${X(Date.parse(p.time)).toFixed(1)} ${Y(p.chanceBps).toFixed(1)}`).join(" L ") + ` L ${R} ${Y(last.chanceBps).toFixed(1)}`;
      out += `<path d="M ${X(Date.parse(points[0].time)).toFixed(1)} ${B} L ${line} L ${R} ${B} Z" fill="${color}" fill-opacity="0.1"/>` +
        `<path d="M ${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` +
        `<circle cx="${R}" cy="${Y(last.chanceBps).toFixed(1)}" r="3.5" fill="${color}"/>`;
      svg.setAttribute("aria-label", `Over the last 7 days the chance ${risk} went from ${pct(points[0].chanceBps)} to ${pct(last.chanceBps)}.`);
    } else {
      svg.setAttribute("aria-label", `The chance ${risk} over the last 7 days: loading.`);
    }
    for (const l of lines) {
      out += `<line x1="${L}" y1="${Y(l.bps)}" x2="${R}" y2="${Y(l.bps)}" stroke="#7D868E" stroke-width="1" stroke-dasharray="4 4"/>` + tick(l.bps);
      if (l.label) out += `<text x="${L + 6}" y="${Y(l.bps) - 5}" font-size="11" fill="#3E464D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">${l.label}</text>`;
    }
    svg.innerHTML = out;
  }

  // --- (3) The three users.
  function drawTitle() {
    if (nowBps() === null || !agent) return;
    $("users-title").textContent = `What each user does with the ${agent.holding.asset} number (${pct(nowBps())})`;
  }

  function drawAgent() {
    if (!agent || !defi) return;
    const h = agent.holding, t = agent.threats.find((x) => x.symbol === defi.symbol);
    const now = nowBps(), trigger = Math.round(t.trigger * 10000), need = t.decision.needed, held = t.alreadyCovered, side = t.decision.side;
    // The cover math is policy.ts's: the expected loss, and one contract pays $1.
    const loss = t.input.exposureUsd * t.input.shock * t.input.hedgeRatio, pays = (held || need) * 1;
    const covered = held >= need, past = now >= trigger;
    ruleBar($("agent-rule"), {
      zones: [{ fromBps: 0, label: "Wait", tone: "grey" }, { fromBps: trigger, label: "Buy cover", tone: "blue" }],
      active: past ? 1 : 0,
      nowBps: now,
      label: `Rule: below ${pct(trigger)} it waits; at ${pct(trigger)} or more it buys cover. The chance is ${pct(now)} now.`,
    });
    const fill = agent.fills.find((f) => f.symbol === t.symbol);
    at($("agent-at"), held ? "blue" : "", `At ${pct(now)}`,
      held ? `Holds ${held}${covered ? "" : " of " + need} ${side} contracts` : "Holds no cover yet",
      held && fill ? `Paper trade, bought ${day(fill.ts)}` : `It buys ${need} ${side} contracts at ${pct(trigger)}`);
    const most = Math.max(loss, pays);
    bars($("agent-bars"), [
      { name: "Expected loss", share: loss / most, text: dollars(loss), tone: "orange" },
      { name: held ? "Cover pays" : "Cover would pay", share: pays / most, text: dollars(pays), tone: "blue" },
    ]);
    $("agent-text").textContent =
      `The agent has a declared holding of $${Math.round(h.valueUsd)} of ${h.asset} (${h.amount} ${h.asset}) and watches one event: ${t.risk}. Its rule is yes or no: at ${pct(trigger)} or more it buys cover, once. ` +
      `${held ? "It holds" : "It would buy"} ${held || need} contracts on the ${side} side, which pay $1 each if that happens: ${dollars(pays)} against an expected loss of ${dollars(loss)}. ` +
      `Each buy is a paper trade at Gemini’s live price, with the premium paid in USDC on Arc.`;
  }

  function drawPool() {
    if (!defi) return;
    const asset = agent ? agent.holding.asset : "collateral", now = nowBps();
    const tiers = defi.tiers, p = defi.params, per = (t) => "$" + t.maxLtvBps / 100, normal = tiers[0];
    const tone = toneOf(p.level);
    ruleBar($("pool-rule"), {
      zones: tiers.map((t, i) => ({ fromBps: t.thresholdBps, label: t.paused ? "Pause" : per(t), tone: i === 0 ? "grey" : t.paused ? "red" : i === 1 ? "orange" : "orange2" })),
      active: p.level,
      nowBps: now,
      label: "Rule: " + tiers.map((t, i) => `${i ? `at ${pct(t.thresholdBps)} or more` : `under ${pct(tiers[1].thresholdBps)}`} ${t.paused ? "it pauses" : `it lends ${per(t)} per $100`}`).join("; ") + `. The chance is ${pct(now)} now.`,
    });
    const change = defi.history.find((c) => c.pool === defi.pool.name);
    const behind = levelAt(now) !== p.level; // the feed moved to another tier and the pool has not synced yet
    at($("pool-at"), tone, `At ${pct(now)}`,
      p.paused ? "New loans paused" : `Lends up to ${per(p)} per $100`,
      behind ? "Waiting for its next sync with the oracle." : p.level === 0 ? "Its normal limit." : `Normally ${per(normal)}.` + (change ? ` Changed ${ago(Date.parse(change.time) / 1000)}.` : ""));
    bars($("pool-bars"), [
      { name: "Normal limit", share: normal.maxLtvBps / 10000, text: per(normal), tone: "" },
      { name: "Limit now", share: p.paused ? 0 : p.maxLtvBps / 10000, text: p.paused ? "$0" : per(p), tone },
    ]);
    $("pool-text").textContent =
      `This demo pool follows the oracle on its own. The limit is checked only when someone borrows: ` +
      (p.paused ? `new loans are paused now, against ${per(normal)} per $100 of ${asset} normally. ` : p.level === 0 ? `${per(p)} per $100 of ${asset} now, its normal limit. ` : `${per(p)} per $100 of ${asset} now, ${per(normal)} normally. `) +
      `Open loans are left alone, so nobody is liquidated by it, and the limit rises again when the odds fall.`;
  }

  function drawAave() {
    if (!advisor || !defi) return;
    const token = advisor.market.split(", ").pop().replace(" reserve", ""); // "cirBTC"
    const cf = advisor.current.collateralFactorBps, next = advisor.recommended, level = advisor.level, now = advisor.harm.harmBps;
    const cut = (step) => (cf - step.collateralFactorBps) / 100;
    const tone = level === 0 ? "" : next.frozen ? "red" : "orange";
    const cuts = advisor.ladder.filter((s) => !s.frozen && cut(s) > 0).map(cut);
    ruleBar($("aave-rule"), {
      zones: defi.tiers.map((t, i) => {
        const step = advisor.ladder[i];
        return { fromBps: t.thresholdBps, label: step.frozen ? "Freeze" : cut(step) === 0 ? "No change" : `−${cut(step)}${cut(step) === cuts[0] ? " points" : ""}`, tone: i === 0 ? "grey" : step.frozen ? "red" : i === 1 ? "orange" : "orange2" };
      }),
      active: level,
      nowBps: now,
      label: "Rule: " + defi.tiers.map((t, i) => `${i ? `at ${pct(t.thresholdBps)} or more` : `under ${pct(defi.tiers[1].thresholdBps)}`}, ${advisor.ladder[i].frozen ? "freeze new borrowing" : cut(advisor.ladder[i]) ? cut(advisor.ladder[i]) + " points lower" : "no change"}`).join("; ") + `. The chance is ${pct(now)} now.`,
    });
    at($("aave-at"), tone, `At ${pct(now)}`,
      next.frozen ? "Suggest a freeze" : level === 0 ? "Suggest no change" : `Suggest ${pct(cf)} → ${pct(next.collateralFactorBps)}`,
      next.frozen ? `No new borrowing against ${token}` : level === 0 ? `${token} collateral factor stays ${pct(cf)}` : `${token} collateral factor, ${cut(next)} points lower`);
    const open = (frozen) => (frozen ? "Frozen" : "Open");
    $("aave-table").innerHTML =
      `<tr><th></th><th>Now</th><th>At ${pct(now)}</th></tr>` +
      `<tr><td>Collateral factor</td><td>${pct(cf)}</td><td>${pct(next.collateralFactorBps)}</td></tr>` +
      `<tr><td>New borrowing</td><td>${open(advisor.current.frozen)}</td><td>${open(next.frozen)}</td></tr>`;
    bars($("aave-bars"), [
      { name: "Now", share: cf / 10000, text: "$" + cf / 100, tone: "" },
      { name: "Suggested", share: next.frozen ? 0 : next.collateralFactorBps / 10000, text: next.frozen ? "$0" : "$" + next.collateralFactorBps / 100, tone },
    ]);
    $("aave-text").textContent =
      `A real market on Arc mainnet, where ${token} is collateral. In Aave V4 the collateral factor sets both how much you can borrow and when you get liquidated. ` +
      `V4 applies a change only to new positions: an open loan keeps its factor unless its owner borrows more or withdraws collateral. So our suggestion is for new positions, and Aave’s governance decides.`;
    $("proposal-text").textContent = advisor.proposal;
    $("proposal-open").disabled = false;
  }
  $("proposal-open").onclick = () => $("proposal").showModal();
  $("proposal-close").onclick = () => $("proposal").close();

  function draw() {
    if (oracle) { drawPrices(); drawOutputs(); }
    drawTitle();
    drawAgent();
    drawPool();
    drawAave();
  }
  addEventListener("resize", draw); // the charts and the rule bars are drawn in pixels
  document.fonts.ready.then(draw);

  // --- Loading. Gemini allows about one public call a second, so the routes that ask Gemini
  // go one after another; the chain reads go in a second line beside them.
  async function loadOracle() {
    try {
      oracle = await get("/api/oracle");
      bar.gemini(oracle.markets.some((m) => m.gemini.prob !== null));
    } catch {
      bar.gemini(false);
    }
    draw();
  }
  const loadAgent = async () => { agent = await get("/api/agent"); draw(); };
  const loadPool = async () => { defi = await get("/api/defi"); draw(); };
  async function loadAave() {
    try {
      advisor = await get("/api/advisor");
      draw();
    } catch {
      if (!advisor) at($("aave-at"), "", "Aave V4 on Arc mainnet", "Not read", "The read failed. Reload the page to try again.");
    }
  }
  async function loadHistory() {
    for (const m of oracle ? oracle.markets : []) {
      history[m.symbol] = (await get(`/api/history?symbol=${encodeURIComponent(m.symbol)}`)).points;
      draw();
    }
  }
  loadPool().then(loadAave).catch(() => {});
  loadOracle().then(loadAgent).then(loadHistory).catch(() => {});

  setInterval(loadOracle, 60000); // Gemini's side; ours arrives over /events
  setInterval(() => { for (const s of document.querySelectorAll(".posted-ago")) s.textContent = "Posted " + ago(Number(s.dataset.at)); }, 1000);

  // --- Live. A post by the oracle for one of our markets runs the dots along the arrow.
  live.addEventListener("oracle", (e) => {
    const post = JSON.parse(e.data), m = oracle && oracle.markets.find((x) => x.symbol === post.symbol);
    if (!m || !post.txHash) return;
    runFlow($("conn"));
    m.onchain = { ...m.onchain, probBps: post.probBps, round: post.round, txUrl: post.txUrl, publishedAt: Date.parse(post.ts) / 1000 };
    draw();
    loadAave().catch(() => {});
  });
  live.addEventListener("agent", (e) => {
    const step = JSON.parse(e.data);
    if (!step.demo && (step.step === "done" || step.step === "hold")) loadAgent().catch(() => {});
  });
  live.addEventListener("defi", (e) => {
    const sync = JSON.parse(e.data);
    if (defi && sync.pool === defi.pool.name && sync.txHash) loadPool().then(loadAave).catch(() => {});
  });
</script>
</body>
</html>
