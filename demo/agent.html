<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probability Oracle: agent insurance demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/demo.css">
</head>
<!-- The agent demo (units 7.8, 7.16, 7.20). REPLAY of real Gemini hourly prices for the BTC
     market, in about 30 seconds. One replay reads as a story in five large steps: watching,
     paying to read, deciding, buying cover, covered. The paid reads and the premium are real
     testnet transactions; the cover is a PAPER TRADE; the holding is a DECLARED HOLDING. -->
<body class="screen">
<header class="bar" id="bar"></header>

<main class="page">
  <section class="demo-head">
    <div class="ptitle">
      <h1>Agent insurance demo</h1>
      <button class="how" id="how-decides" type="button" aria-expanded="false" aria-controls="decides">How the agent decides</button>
      <button class="how" id="how-cover" type="button" aria-expanded="false" aria-controls="cover-box">How the cover is bought</button>
    </div>
    <div class="controls">
      <div class="progress">
        <div class="track" id="progress" role="progressbar" aria-label="Replay progress" aria-valuemin="0"><i id="progress-fill"></i></div>
        <div class="labels"><span id="progress-from"></span><b id="progress-clock"></b><span id="progress-to"></span></div>
      </div>
      <button class="primary" id="start" type="button">Start replay</button>
    </div>
  </section>
  <div class="howtext over left" id="decides" hidden>
    <ol class="steps" id="steps"></ol>
    <div class="result" id="result"></div>
  </div>
  <div class="howtext over left" id="cover-box" hidden>
    <div class="cover" id="cover"></div>
  </div>

  <div class="banner" id="banner" role="status"></div>

  <section class="panel storypanel" aria-labelledby="wf-title">
    <div class="between"><h2 id="wf-title">What the agent does at each post</h2><span class="tags"><span class="chip">Replay</span><span class="chip">Declared holding</span><span class="chip">Paper trade</span></span></div>
    <ol class="wsteps story" id="wf"></ol>
    <div class="wallets three">
      <div class="wallet" id="w-agent"><small>Agent’s wallet, paid in this replay</small><b></b></div>
      <div class="wallet" id="w-seller"><small>Oracle’s wallet, through Circle Gateway</small><b></b></div>
      <div class="wallet" id="w-treasury"><small>Treasury, on Arc</small><b></b></div>
    </div>
  </section>

  <div class="row-low tall">
    <section class="panel chart" aria-labelledby="chart-title" style="flex: 1.5 1 0; padding: 12px 18px 6px; gap: 4px">
      <h2 id="chart-title">Chance</h2>
      <svg class="plot" id="plot" role="img"></svg>
    </section>
    <section class="panel" aria-labelledby="events-title" style="flex: 1 1 0">
      <h2 id="events-title">Events</h2>
      <div class="scroll"><ol class="events" id="events"></ol></div>
    </section>
  </div>
</main>

<script src="/static/demo.js"></script>
<script>
  const money = (n) => "$" + n.toFixed(2);

  // The chart: the chance as the oracle posted it, the agent's trigger, the buy at the real
  // fill, a "Covered from here" band, and a playhead at the newest post.
  // The post the agent bought at: the one whose paid read led to the fill.
  function buyIndexOf(view) {
    const fill = view.fill, points = view.run ? view.run.published : [];
    return fill ? points.findIndex((_, i) => during(view.run, i, fill.at)) : -1;
  }
  function drawPlot(view, head) {
    const svg = $("plot"), w = svg.clientWidth, h = svg.clientHeight;
    if (!w || !h) return;
    const run = view.run, done = run && run.status === "done", buyIndex = buyIndexOf(view);
    // The posts the playhead has reached; the newest one's value is still moving to its number.
    const points = head ? run.published.slice(0, head.shown).map((p, i) => (i === head.shown - 1 ? { ...p, harmBps: head.bps } : p)) : [];
    const L = 40, R = w - 12, T = 14, B = h - 44;
    const { X, days } = replayScale(view, L, R), Y = (bps) => B - (bps / 10000) * (B - T);
    const trigger = pct(view.triggerBps);
    let out = `<line x1="${L}" y1="${T}" x2="${R}" y2="${T}" stroke="#DDE1E4"/><line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#AEB6BD"/>`;
    for (const bps of [0, 5000, 10000]) out += `<text x="${L - 8}" y="${Y(bps) + 4}" font-size="12" fill="#59626A" text-anchor="end">${bps / 100}%</text>`;
    for (const d of days) out += `<text x="${d.x}" y="${h - 8}" font-size="12" fill="#59626A" text-anchor="middle">${d.label}</text>`;
    
    out += `<line x1="${L}" y1="${Y(view.triggerBps)}" x2="${R}" y2="${Y(view.triggerBps)}" stroke="#1C2126" stroke-width="1.5" stroke-dasharray="6 5"/>` +
      `<text x="${L + 6}" y="${Y(view.triggerBps) - 7}" font-size="12.5" font-weight="500" fill="#1C2126" paint-order="stroke" stroke="#F4F5F6" stroke-width="4">The agent buys cover when this reaches ${trigger}</text>`;

    // The real hourly history that the replay plays back, in grey until the oracle posts it.
    out += `<path d="${stepped(view.path, X, Y, R)}" fill="none" stroke="#C9CED3" stroke-width="1.5" stroke-linejoin="round"/>`;
    if (points.length) {
      const last = points.at(-1), headX = Math.min(R, X(head.t)), line = stepped(points, X, Y, headX), atEnd = done && headX >= R - 0.5;
      out += `<path d="${line} V ${B} H ${X(points[0].time).toFixed(1)} Z" fill="#2756C5" fill-opacity="0.08"/>` +
        `<path d="${line}" fill="none" stroke="#2756C5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (!atEnd) out += `<line x1="${headX}" y1="${T}" x2="${headX}" y2="${B}" stroke="#7D868E" stroke-width="1"/>`; // the playhead

      if (view.fill && buyIndex >= 0 && buyIndex < points.length) {
        const p = run.published[buyIndex], x = X(p.time), y = Y(p.harmBps), left = x > R - 220;
        out += `<line x1="${x}" y1="${T}" x2="${x}" y2="${B}" stroke="#2756C5" stroke-width="1" stroke-dasharray="2 4"/>` +
          `<rect x="${x}" y="${B + 6}" width="${Math.max(3, headX - x)}" height="10" rx="2" fill="#2756C5"/>` +
          `<text x="${left ? x - 6 : x + 6}" y="${B - 6}" font-size="12" font-weight="600" fill="#1E46A3" text-anchor="${left ? "end" : "start"}" paint-order="stroke" stroke="#F4F5F6" stroke-width="4">Covered from here</text>` +
          `<circle cx="${x}" cy="${y}" r="11" fill="#2756C5" fill-opacity="0.18"/><circle cx="${x}" cy="${y}" r="5" fill="#2756C5"/>` +
          `<text x="${left ? x - 12 : x + 12}" y="${y + 24}" font-size="13" font-weight="600" fill="#1C2126" text-anchor="${left ? "end" : "start"}" paint-order="stroke" stroke="#F4F5F6" stroke-width="4">Bought ${view.fill.contracts} for ${money(view.fill.premiumUsdc)}</text>`;
      }
      out += `<circle cx="${headX}" cy="${Y(last.harmBps)}" r="4" fill="#2756C5"/>` +
        `<text x="${headX - 8}" y="${Y(last.harmBps) - (Math.abs(last.harmBps - view.triggerBps) < 600 ? 30 : 12)}" font-size="13" font-weight="600" fill="#1E46A3" text-anchor="end" paint-order="stroke" stroke="#F4F5F6" stroke-width="4">${Math.round(last.harmBps / 100)}% ${atEnd ? "at the end" : "now"}</text>`;
      svg.setAttribute("aria-label", `During the replay the chance ${view.risk} went from ${pct(points[0].harmBps)} to ${pct(run.published.at(-1).harmBps)}.` +
        (view.fill ? ` The agent bought ${view.fill.contracts} contracts for ${money(view.fill.premiumUsdc)} at ${clockAt(run, view.fill.at)} and stayed covered.` : ` The agent's trigger is ${trigger}.`));
    } else {
      svg.setAttribute("aria-label", `The chance ${view.risk}. The replay has not started; the agent's trigger is ${trigger}.`);
    }
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.innerHTML = out;
  }

  // The two explanations open from the header, one at a time.
  for (const [button, box] of [["how-decides", "decides"], ["how-cover", "cover-box"]]) $(button).onclick = () => {
    const opening = $(box).hidden;
    for (const [b, x] of [["how-decides", "decides"], ["how-cover", "cover-box"]]) { $(x).hidden = true; $(b).setAttribute("aria-expanded", false); }
    $(box).hidden = !opening;
    $(button).setAttribute("aria-expanded", opening);
  };

  bootDemo("agent", (view) => {
    const run = view.run, points = run ? run.published : [], done = run && run.status === "done";
    const hold = view.agent.holding, t = view.threat, fill = view.fill, trigger = pct(view.triggerBps);
    const need = view.agent.needed, loss = view.expectedLossUsd;
    const buyIndex = buyIndexOf(view), last = points.at(-1);

    $("chart-title").textContent = "Chance " + view.risk;

    // --- The banner follows the run.
    if (fill) {
      banner({ tone: "blue", icon: "check", title: `Covered: ${fill.contracts} contracts bought for ${money(fill.premiumUsdc)} at ${buyIndex >= 0 ? pct(points[buyIndex].harmBps) : trigger}`, more: `If ${view.risk}, they pay the agent ${money(fill.contracts)}.`, href: fill.txUrl });
    } else if (!run) {
      banner({ tone: "", icon: "idle", title: `Ready to replay ${$("progress-from").textContent} to ${$("progress-to").textContent}`, more: "Real Gemini prices, played back in about 30 seconds. Press Start replay." });
    } else if (!last) {
      banner({ tone: "", icon: "idle", title: "Starting", more: "The oracle is posting the first price on Arc." });
    } else if (view.agent.status === "buying") {
      banner({ tone: "blue", icon: "check", title: `Buying cover: the chance reached ${pct(last.harmBps)}`, more: "The agent is paying the premium on Arc." });
    } else {
      banner({ tone: "", icon: "idle", title: done ? `No cover bought: the chance ended at ${pct(last.harmBps)}` : `Watching: the chance is ${pct(last.harmBps)}`, more: `The agent buys cover when it reaches ${trigger}.` });
    }

    // --- The story: one post, in five steps. While the replay runs it follows the newest
    // post; afterwards it shows the post the agent bought at. Once cover is bought, the last
    // two steps stay lit.
    const reads = view.reads, paid = reads.reduce((sum, r) => sum + r.usdc, 0), premium = fill ? fill.premiumUsdc : 0;
    $("w-agent").querySelector("b").textContent = "$" + (paid + premium).toFixed(3);
    $("w-seller").querySelector("b").textContent = "$" + paid.toFixed(3);
    $("w-treasury").querySelector("b").textContent = money(premium);

    const shown = points.length ? (done && buyIndex >= 0 ? buyIndex : points.length - 1) : -1;
    const p = shown >= 0 ? points[shown] : null, read = p ? setOffBy(run, shown, reads) : null, bought = shown >= 0 && shown === buyIndex;
    const under = p && p.harmBps < view.triggerBps, after = !!fill && !bought; // after: a post later than the purchase
    $("wf-title").textContent = p ? "What the agent did at " + clockAt(run, bought ? fill.at : read ? read.at : p.at) : "What the agent does at each post";
    const story = [
      { title: "Watching", big: p && pct(p.harmBps), call: "OddsUpdated, on Arc", idle: "Every post of the oracle wakes the agent.", detail: p && `Round ${p.round}: the chance ${view.risk.replace(/ on .*$/, "")}.` },
      { title: "Paying to read", big: read && "$" + read.usdc.toFixed(3), call: "GET /odds/:symbol → 402 → x402 → 200", idle: "The oracle asks for $0.001 in USDC. The agent pays through Circle Gateway and gets the chance.", detail: read && `Paid in USDC through Circle Gateway` + (read.payment ? `, payment ${read.payment.slice(0, 8)}.` : ".") },
      { title: "Deciding", big: p && (under ? "Wait" : after ? "Hold" : "Buy"), call: "OddsFeed.latestBySymbol, policy.decide()", idle: `It checks the same value onchain, then buys only at ${trigger} or more.`, detail: p && (read && read.round ? `Round ${read.round} on Arc holds the same value. ` : "") + (under ? `${pct(p.harmBps)} is under ${trigger}: it keeps watching.` : after ? "Already covered: nothing more to buy." : `${pct(p.harmBps)} is ${trigger} or more: cover is needed.`) },
      { title: "Buying cover", big: fill && money(fill.premiumUsdc), call: "ProtectionBook.buyProtection", idle: `${need} ${t.side} contracts at Gemini’s price, as a paper trade. The premium goes to the treasury in USDC.`, detail: fill && `${fill.contracts} ${t.side} contracts × ${money(fill.price)}, a paper trade at Gemini’s price. Paid at ${clockAt(run, fill.at)}.`, href: fill && fill.txUrl, tone: "blue", always: after },
      { title: "Covered", big: fill && money(fill.contracts), call: "pays $1 a contract", idle: `If ${view.risk}, the contracts pay the agent.`, detail: fill && `Paid to the agent if ${view.risk}.`, tone: "blue", always: after },
    ];
    if (!p) story.forEach((x) => { x.detail = null; x.href = null; x.tone = ""; x.big = null; });
    workflow($("wf"), p ? p.round : "idle", story, !p ? 5 : !read ? 1 : bought ? 5 : 3, !!run && !done, (n) => {
      const cards = $("wf").children;
      if (n === 2) coin(cards[1], $("w-seller"), "$0.001");
      if (n === 4 && bought) coin(cards[3], $("w-treasury"), money(fill.premiumUsdc));
    });

    // --- How the agent decides: four lines with the numbers of this run.
    const lines = [
      [`Its declared holding is `, el("b", "", `$${Math.round(hold.valueUsd)}`), ` of ${hold.asset} (${hold.amount} ${hold.asset}).`],
      [`If ${view.risk}, it expects to lose about ${t.shock * 100}%: `, el("b", "", money(loss)), `.`],
      [`A ${t.side} contract pays $1 if that happens, so `, el("b", "", `${need} contracts`), ` cover the loss.`],
      fill
        ? [`When the chance reached ${trigger}, it bought them at Gemini’s price: ${fill.contracts} × ${money(fill.price)} = `, el("b", "", money(fill.premiumUsdc)), `.`]
        : [`When the chance reaches ${trigger}, it buys them at `, el("b", "", "Gemini’s price"), ` for that hour.`],
    ];
    $("steps").replaceChildren(...lines.map((parts, i) => {
      const item = el("li", i === 3 && fill ? "on" : ""), text = el("span");
      text.append(...parts);
      item.append(el("span", "badge", i + 1), text);
      return item;
    }));
    $("result").className = "result" + (fill ? " blue" : "");
    $("result").replaceChildren(el("b", "", "Result:"), fill
      ? ` it pays ${money(fill.premiumUsdc)} now to get ${money(fill.contracts)} back if ${view.asset} drops, ${fill.contracts >= loss ? "more than" : "against"} the ${money(loss)} it expects to lose.`
      : ` nothing bought yet. Under ${trigger}, the agent only watches.`);

    // --- How the cover is bought: the contract, the count, the stand-in, and the real version.
    const boxes = [
      [`The ${t.side} contract`, `On Gemini’s market “${view.label ?? view.symbol}”, a ${t.side} contract pays $1 if ${view.risk}. Its price is the chance of that, so cover costs more as the risk grows.`],
      [`Why ${need} contracts`, `The declared holding is $${Math.round(hold.valueUsd)} of ${hold.asset}. A drop is taken as ${t.shock * 100}% and the agent covers ${t.hedgeRatio * 100}% of it: ${money(loss)}, rounded up to ${need} contracts at $1 each.`],
      ["Paper trade, real premium", `The trade is a paper trade at Gemini’s real price` + (fill ? `: ${fill.contracts} × ${money(fill.price)}` : "") + `. The ${fill ? money(fill.premiumUsdc) + " " : ""}premium is real testnet USDC, paid on Arc through ProtectionBook to the treasury.`],
      ["What a real version does", `It places the same order on Gemini with real money, or the premium goes into a funded payout pool on Arc that pays ${money(need)} when the market settles against the holder.`],
    ];
    $("cover").replaceChildren(...boxes.map(([title, text]) => { const d = el("div"); d.append(el("b", "", title), el("span", "", text)); return d; }));

    // --- Events, on the replay clock.
    const rows = [];
    if (run) {
      rows.push({ at: run.startedAt, kind: "info", title: "Replay started", more: run.via === "stream" ? "Posts reach the agent through the QuickNode Stream" : "Stream off: the server tells the agent about each post" });
      points.forEach((pt, i) => {
        const r = setOffBy(run, i, view.reads);
        if (r) rows.push({ at: r.at, kind: "data", title: `Read the oracle: ${pct(pt.harmBps)}`, more: pt.harmBps < view.triggerBps ? `Paid $0.001. Under ${trigger}, no purchase` : i === buyIndex ? "Paid $0.001" : "Paid $0.001. Already covered" });
        if (i === buyIndex) rows.push({ at: fill.at, kind: "action", title: `Bought ${fill.contracts} contracts for ${money(fill.premiumUsdc)}`, more: `The chance reached ${pct(pt.harmBps)}`, tone: "blue" });
      });
      if (done) rows.push({ at: run.endedAt, kind: "info", title: `Replay ended at ${pct(last.harmBps)}`, more: fill ? "Already covered, nothing more to buy" : "No cover bought" });
      events($("events"), run, rows);
    } else {
      $("events").replaceChildren(el("li", "empty", "Nothing yet. Each read and the purchase appear here as the replay runs."));
    }
  }, drawPlot);
</script>
</body>
</html>
